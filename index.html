<!DOCTYPE html>
<html>
<head>
<title>TradeFlow - For Market Women</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background: #f5f5f5; padding: 20px; }
.card { background: white; padding: 20px; margin: 10px 0; border-radius: 12px; box-shadow: 0 2px 5px #ccc; }
.big { font-size: 28px; font-weight: bold; color: #0a7a42; }
.btn { background: #0a7a42; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-size: 18px; margin-top: 10px; }
input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
</style>
</head>
<body>
<h1>📊 TradeFlow</h1>
<p>AI for Naija Business - Built in Otukpo</p>

<div class="card">
<div>Total Revenue</div>
<div class="big" id="revenue">Loading...</div>
</div>

<div class="card">
<div>Profit (Na Your Gain)</div>
<div class="big" id="profit">Loading...</div>
<div id="margin"></div>
</div>

<div class="card">
<div>Best Seller - Make You Stock Am</div>
<div class="big" id="best">Loading...</div>
<div id="advice"></div>
</div>

<div class="card">
<h3>Ask AI - Ask Anything About Your Market</h3>
<input id="question" placeholder="e.g. What should I stock? Why profit high?" />
<button class="btn" onclick="askAI()">Ask TradeFlow AI</button>
<div id="answer" style="margin-top:15px; font-size:18px;"></div>
</div>

<script>
async function loadDashboard() {
  let res = await fetch('http://127.0.0.1:8000/dashboard');
  let data = await res.json();
  document.getElementById('revenue').innerText = '₦' + data.financials.total_revenue.toLocaleString();
  document.getElementById('profit').innerText = '₦' + data.financials.profit.toLocaleString();
  document.getElementById('margin').innerText = 'Margin: ' + data.financials.profit_margin.toFixed(1) + '%';
  
  let res2 = await fetch('http://127.0.0.1:8000/insights');
  let data2 = await res2.json();
  document.getElementById('best').innerText = data2.best_seller;
  document.getElementById('advice').innerText = data2.advice;
}

async function askAI() {
  let q = document.getElementById('question').value;
  if(!q) return alert('Type question first');
  document.getElementById('answer').innerText = 'Thinking...';
  let res = await fetch('http://127.0.0.1:8000/ask?question=' + encodeURIComponent(q));
  let data = await res.json();
  document.getElementById('answer').innerText = data.answer;
}

loadDashboard();
</script>
</body>
</html>
